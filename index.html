<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoApp | Deal-Scanner & Preisvergleich</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">
    <nav class="bg-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-indigo-600">AUTOAPP</h1>
            <div class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded-full font-bold animate-pulse">
                SCANNER AKTIV
            </div>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4">
        <div class="bg-indigo-700 rounded-3xl p-6 text-white shadow-2xl mb-8">
            <p class="text-indigo-200 text-xs uppercase tracking-widest font-bold">Verfügbares Guthaben</p>
            <h2 class="text-5xl font-mono my-3 font-bold">0,00 €</h2>
            <div class="grid grid-cols-2 gap-3 mt-4 text-center">
                <div class="bg-white/10 p-2 rounded-xl border border-white/20 text-[10px]">Deals gescannt: 124</div>
                <div class="bg-white/10 p-2 rounded-xl border border-white/20 text-[10px]">Klicks heute: 0</div>
            </div>
        </div>

        <h3 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-tighter">Beste Technik-Angebote (Live)</h3>
        
        <div class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="text-3xl">🎧</div>
                <div class="flex-1">
                    <p class="font-bold text-sm text-slate-800">Premium Over-Ear Kopfhörer</p>
                    <p class="text-indigo-600 text-xs font-bold">Rabatt: -24%</p>
                </div>
                <button class="bg-slate-100 text-slate-400 px-3 py-2 rounded-lg text-[10px] font-bold">Prüfe...</button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div class="text-3xl">⌚</div>
                <div class="flex-1">
                    <p class="font-bold text-sm text-slate-800">Smartwatch Serie 9</p>
                    <p class="text-indigo-600 text-xs font-bold">Rabatt: -15%</p>
                </div>
                <button class="bg-slate-100 text-slate-400 px-3 py-2 rounded-lg text-[10px] font-bold">Prüfe...</button>
            </div>
        </div>
    </main>

    <footer class="mt-10 p-6 text-center text-slate-400 text-[10px]">
        <p>© 2026 AutoApp - Automatisierter Preisvergleich</p>
    </footer>
</body>
</html>
