<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Profit System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6 font-sans">
    <div class="max-w-md mx-auto bg-gray-900 rounded-3xl p-8 border border-green-500 shadow-2xl mt-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-xl font-black text-green-500">AUTO-APP V1</h1>
            <span class="bg-green-900 text-green-300 text-xs px-2 py-1 rounded animate-pulse">LIVE</span>
        </div>
        
        <div class="text-center mb-10">
            <p class="text-gray-500 text-xs uppercase tracking-widest">Verfügbares Budget</p>
            <h2 class="text-6xl font-mono font-bold mt-2" id="money">0,00 €</h2>
        </div>

        <div class="space-y-4">
            <button onclick="manage('Auszahlen')" class="w-full bg-green-600 hover:bg-green-700 py-4 rounded-2xl font-bold transition-all shadow-lg text-white">
                💰 Auszahlen
            </button>
            <button onclick="manage('Reinvestieren')" class="w-full bg-gray-800 hover:bg-gray-700 py-4 rounded-2xl font-bold transition-all border border-gray-600 text-white">
                🔄 Reinvestieren
            </button>
        </div>

        <div class="mt-12 p-4 bg-black rounded-xl border border-gray-800">
            <p class="text-[10px] text-gray-500 uppercase font-bold mb-2">System-Log:</p>
            <div id="log" class="text-xs text-blue-400 font-mono">Scanne nach Provisionen...</div>
        </div>
    </div>

    <script>
        function manage(typ) {
            const ok = confirm("Möchtest du das Budget wirklich " + typ + "?");
            if(ok) alert("Befehl bestätigt. Ich frage dich vor der nächsten Transaktion erneut.");
        }
        
        // Simulierter Markt-Scan
        setInterval(() => {
            const logs = ["Suche Deals...", "Analysiere Klicks...", "Provision erkannt...", "Warte auf Bestätigung..."];
            document.getElementById('log').innerText = logs[Math.floor(Math.random() * logs.length)];
        }, 3000);
    </script>
</body>
</html>
