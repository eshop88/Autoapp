<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Deal-Finder | Autoapp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-blue-600">AUTOAPP <span class="text-gray-400">v2.1</span></h1>
            <div id="status" class="flex items-center gap-2 text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span> SYSTEM AKTIV
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-lg">
        <div class="bg-gradient-to-br from-blue-600 to-blue-700 rounded-3xl p-6 text-white shadow-xl mb-8">
            <p class="text-blue-100 text-xs uppercase tracking-widest font-semibold">Dein Guthaben</p>
            <div class="text-4xl font-bold my-2" id="money">0,00 €</div>
            <div class="flex gap-2 mt-4">
                <button onclick="manage('Auszahlen')" class="flex-1 bg-white/20 hover:bg-white/30 py-2 rounded-xl text-xs font-bold transition">Auszahlen</button>
                <button onclick="manage('Details')" class="flex-1 bg-black/20 hover:bg-black/30 py-2 rounded-xl text-xs font-bold transition">Budget-Plan</button>
            </div>
        </div>

        <h3 class="text-sm font-bold text-gray-500 uppercase mb-4 tracking-tight">Top Empfehlungen der KI</h3>
        <div id="deal-container" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-16 h-16 bg-gray-100 rounded-xl flex items-center justify-center text-2xl">📱</div>
                <div class="flex-1">
                    <p class="font-bold text-sm">Smartphone Angebote</p>
                    <p class="text-blue-600 text-xs font-bold">Bis zu 15% Provision</p>
                </div>
                <button class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-xs font-bold">Link</button>
            </div>
        </div>
    </main>

    <script>
        function manage(action) {
            alert("Sicherheitsabfrage: Möchtest du " + action + " starten? Ich werde dich vor der Transaktion erneut fragen.");
        }
        // Simulation der Markt-Suche
        setTimeout(() => {
            console.log("AdCell-Schnittstelle bereit...");
        }, 1000);
    </script>
</body>
</html>
